<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Player of the Season | 90 Minutes or More</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #050505; 
            color: #fbbf24; /* Amber/Gold */
            overflow-x: hidden;
            -ms-overflow-style: none; 
            scrollbar-width: none; 
        }
        body::-webkit-scrollbar { display: none; }
        
        .font-anton { font-family: 'Anton', sans-serif; }

        /* Gold Gradient Text */
        .gold-text {
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* The 3D Card Flip Magic */
        .flip-card { 
            perspective: 1000px; 
            height: 280px; /* Fixed height so the grid doesn't break when flipping */
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .flip-card.flipped .flip-card-inner { 
            transform: rotateY(180deg); 
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1rem;
            border: 1px solid rgba(251, 191, 36, 0.2);
            background: #111;
            overflow: hidden;
        }
        .flip-card-back {
            transform: rotateY(180deg);
            background: #0a0a0a;
            border: 1px solid #fbbf24;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1rem;
        }

        /* Screen Transitions */
        .screen { display: none; height: 100vh; width: 100vw; position: fixed; top: 0; left: 0; z-index: 50; flex-direction: column; align-items: center; justify-content: center; }
        .screen.active { display: flex; }

        /* Intro Pulse Animation */
        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.4); }
            70% { box-shadow: 0 0 0 30px rgba(251, 191, 36, 0); }
            100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
        }
        .pulse-circle { animation: pulse-gold 2s infinite; }

        /* Loading Spinner */
        .loader {
            border: 4px solid rgba(251, 191, 36, 0.1);
            border-left-color: #fbbf24;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- SCREEN 1: THE UNVEILING -->
    <div id="screen-intro" class="screen active bg-[#050505] text-center px-6">
        <div class="pulse-circle w-24 h-24 md:w-32 md:h-32 rounded-full border-2 border-yellow-500 flex items-center justify-center mb-8">
            <i class="fas fa-crown text-4xl md:text-5xl text-yellow-500"></i>
        </div>
        <h1 class="font-anton text-4xl md:text-6xl uppercase tracking-widest gold-text mb-4">Player of the Season</h1>
        <p class="text-gray-400 text-sm md:text-base max-w-md mx-auto mb-10">30 Candidates. One Crown.<br>Presented by 90 Minutes or More.</p>
        <button onclick="startExperience()" class="bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3 px-8 rounded-full text-lg transition duration-300 shadow-[0_0_20px_rgba(251,191,36,0.5)]">
            Unveil Candidates
        </button>
    </div>

    <!-- SCREEN 2: THE GRID -->
    <div id="screen-voting" class="screen bg-[#050505] w-full justify-start overflow-y-auto">
        <!-- Header -->
        <div class="w-full p-4 flex justify-between items-center z-10 bg-gradient-to-b from-[#050505] to-transparent sticky top-0">
            <div class="font-anton text-xl gold-text">90M POTY</div>
            <div class="text-xs text-yellow-500 border border-yellow-500/30 px-3 py-1 rounded-full bg-yellow-500/10 hidden md:block">Click a card to view stats</div>
            <div class="text-xs text-yellow-500 border border-yellow-500/30 px-3 py-1 rounded-full bg-yellow-500/10 md:hidden">Tap to view</div>
        </div>

        <!-- The Responsive Grid: 2 cols on mobile, 5 on desktop -->
        <div id="player-grid" class="w-full max-w-7xl mx-auto px-4 pb-20 grid grid-cols-2 md:grid-cols-5 gap-3 md:gap-4 mt-2">
            <!-- Cards injected by JS -->
        </div>
    </div>

    <!-- SCREEN 3: SUBMISSION LOADING -->
    <div id="screen-loading" class="screen bg-[#050505]">
        <div class="loader mb-6"></div>
        <h2 class="font-anton text-2xl gold-text uppercase tracking-widest">Casting Your Vote...</h2>
    </div>

    <!-- SCREEN 4: THANK YOU -->
    <div id="screen-success" class="screen bg-[#050505] text-center px-6">
        <div class="w-20 h-20 rounded-full bg-yellow-500/20 border-2 border-yellow-500 flex items-center justify-center mb-6">
            <i class="fas fa-check text-3xl text-yellow-500"></i>
        </div>
        <h2 class="font-anton text-3xl md:text-5xl gold-text uppercase mb-4">Vote Received</h2>
        <p class="text-gray-300 text-sm md:text-base mb-8">Your vote for <span id="selected-player-name" class="font-bold text-yellow-500"></span> has been recorded.<br>Check your email for a confirmation.</p>
        <a href="../stadium-zone/index.html" class="bg-transparent border border-yellow-500 text-yellow-500 hover:bg-yellow-500 hover:text-black font-bold py-3 px-8 rounded-full transition duration-300">
            Back to Stadium Zone
        </a>
    </div>

    <!-- HIDDEN NETLIFY FORM -->
    <form name="poty-vote" netlify netlify-honeypot="bot-field" hidden>
        <input type="text" name="player" id="form-player-name" />
        <input type="email" name="email" id="form-player-email" />
    </form>

    <script>
        // --- PLAYER DATA (From your research) ---
        const players = [
            { name: "Jude Bellingham", club: "Real Madrid", stats: "8 Goals, 5 Assists (Club)<br>7 Goals, 1 Assist (World Cup)", img: "https://crests.football-data.org/86.png" },
            { name: "Ousmane Dembélé", club: "PSG", stats: "22 Goals, 12 Assists (Club)<br>6 Goals, 2 Assists (World Cup)", img: "https://crests.football-data.org/524.png" },
            { name: "Luis Díaz", club: "Bayern Munich", stats: "26 Goals, 21 Assists (Club)", img: "https://crests.football-data.org/5.png" },
            { name: "Erling Haaland", club: "Man City", stats: "38 Goals, 9 Assists (Club)<br>7 Goals (World Cup)", img: "https://crests.football-data.org/65.png" },
            { name: "Harry Kane", club: "Bayern Munich", stats: "61 Goals, 7 Assists (Club)<br>6 Goals, 1 Assist (World Cup)", img: "https://crests.football-data.org/5.png" },
            { name: "Khvicha Kvaratskhelia", club: "PSG", stats: "19 Goals, 10 Assists (Club)", img: "https://crests.football-data.org/524.png" },
            { name: "Lamine Yamal", club: "Barcelona", stats: "24 Goals, 17 Assists (Club)<br>World Cup Winner", img: "https://crests.football-data.org/81.png" },
            { name: "Lautaro Martínez", club: "Inter", stats: "22 Goals, 6 Assists (Club)<br>3 Goals, 1 Assist (World Cup)", img: "https://crests.football-data.org/108.png" },
            { name: "Kylian Mbappé", club: "Real Madrid", stats: "42 Goals, 6 Assists (Club)<br>10 Goals, 4 Assists (World Cup)", img: "https://crests.football-data.org/86.png" },
            { name: "Lionel Messi", club: "Inter Miami", stats: "40 Goals, 23 Assists (Club)<br>8 Goals, 4 Assists (World Cup)", img: "https://a.espncdn.com/i/teamlogos/soccer/500/20232.png" },
            { name: "Nuno Mendes", club: "PSG", stats: "6 Goals, 7 Assists (Club)", img: "https://crests.football-data.org/524.png" },
            { name: "Michael Olise", club: "Bayern Munich", stats: "23 Goals, 31 Assists (Club)", img: "https://crests.football-data.org/5.png" },
            { name: "Willian Pacho", club: "PSG", stats: "Defensive Key Contributor<br>UCL Winner", img: "https://crests.football-data.org/524.png" },
            { name: "Fabián Ruiz", club: "PSG", stats: "2 Goals, 5 Assists (Club)<br>World Cup Winner", img: "https://crests.football-data.org/524.png" },
            { name: "Achraf Hakimi", club: "PSG", stats: "3 Goals, 8 Assists (Club)", img: "https://crests.football-data.org/524.png" },
            { name: "Gabriel Magalhães", club: "Arsenal", stats: "5 Goals, 2 Assists (Club)", img: "https://crests.football-data.org/57.png" },
            { name: "Nico Paz", club: "Como", stats: "12 Goals, 6 Assists (Club)", img: "https://crests.football-data.org/7397.png" },
            { name: "Enzo Fernández", club: "Chelsea", stats: "16 Goals, 10 Assists (Club)", img: "https://crests.football-data.org/61.png" },
            { name: "Federico Dimarco", club: "Inter", stats: "7 Goals, 18 Assists (Club)", img: "https://crests.football-data.org/108.png" },
            { name: "Cristian Romero", club: "Tottenham", stats: "1 Goal, 1 Assist (Club)", img: "https://crests.football-data.org/73.png" },
            { name: "Julián Álvarez", club: "Atlético Madrid", stats: "20 Goals, 9 Assists (Club)", img: "https://crests.football-data.org/78.png" },
            { name: "Raphinha", club: "Barcelona", stats: "21 Goals, 8 Assists (Club)", img: "https://crests.football-data.org/81.png" },
            { name: "Désiré Doué", club: "PSG", stats: "15 Goals, 10 Assists (Club)", img: "https://crests.football-data.org/524.png" },
            { name: "Declan Rice", club: "Arsenal", stats: "5 Goals, 11 Assists (Club)", img: "https://crests.football-data.org/57.png" },
            { name: "Rodri", club: "Man City", stats: "2 Goals (Club)<br>World Cup Golden Ball", img: "https://crests.football-data.org/65.png" },
            { name: "Pedri", club: "Barcelona", stats: "2 Goals, 12 Assists (Club)", img: "https://crests.football-data.org/81.png" },
            { name: "Emiliano Martínez", club: "Aston Villa", stats: "16 PL Clean Sheets<br>World Cup Finalist", img: "https://crests.football-data.org/58.png" },
            { name: "Bruno Fernandes", club: "Man United", stats: "9 Goals, 22 Assists (Club)", img: "https://crests.football-data.org/66.png" },
            { name: "Vitinha", club: "PSG", stats: "5 Goals, 8 Assists (Club)", img: "https://crests.football-data.org/524.png" },
            { name: "David Raya", club: "Arsenal", stats: "19 PL Clean Sheets<br>World Cup Winner", img: "https://crests.football-data.org/57.png" }
        ];

        // --- RENDER CARDS ---
        function renderCards() {
            const grid = document.getElementById('player-grid');
            grid.innerHTML = players.map((p, index) => `
                <div class="flip-card" id="card-${index}" onclick="toggleFlip(${index}, event)">
                    <div class="flip-card-inner shadow-[0_0_20px_rgba(251,191,36,0.05)]">
                        
                        <!-- FRONT OF CARD -->
                        <div class="flip-card-front flex flex-col items-center justify-center p-3">
                            <span class="absolute top-2 left-3 text-[10px] font-bold text-yellow-500/50">#${index + 1}</span>
                            
                            <div class="w-16 h-16 md:w-20 md:h-20 rounded-full bg-black border border-yellow-500 flex items-center justify-center mb-3 overflow-hidden">
                                <img src="${p.img}" alt="${p.name}" class="w-10 h-10 md:w-12 md:h-12 object-contain">
                            </div>
                            
                            <h3 class="font-anton text-sm md:text-lg text-white uppercase text-center leading-tight mb-1">${p.name}</h3>
                            <p class="text-yellow-500 text-[10px] md:text-xs font-semibold tracking-wider text-center">${p.club}</p>
                        </div>

                        <!-- BACK OF CARD -->
                        <div class="flip-card-back">
                            <div>
                                <h3 class="font-anton text-sm md:text-lg text-yellow-500 uppercase mb-2 border-b border-yellow-500/30 pb-1 truncate">${p.name}</h3>
                                <p class="text-gray-300 text-[10px] md:text-xs leading-relaxed">${p.stats}</p>
                            </div>
                            
                            <button onclick="castVote('${p.name}', event)" class="w-full bg-yellow-500 text-black font-bold py-2 rounded-lg hover:bg-yellow-400 transition text-xs md:text-sm mt-2">
                                Cast Vote
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // --- LOGIC ---
        function startExperience() {
            document.getElementById('screen-intro').classList.remove('active');
            document.getElementById('screen-voting').classList.add('active');
            renderCards();
        }

        function toggleFlip(index, event) {
            // Prevent the click on the button from triggering the flip again
            if (event.target.tagName === 'BUTTON') return;
            
            const card = document.getElementById(`card-${index}`);
            
            // Optional: Close other flipped cards when a new one is clicked
            document.querySelectorAll('.flip-card').forEach(c => {
                if (c.id !== `card-${index}`) c.classList.remove('flipped');
            });
            
            card.classList.toggle('flipped');
        }

        function castVote(playerName, event) {
            event.stopPropagation(); // Stop the card from flipping back
            
            // Show loading screen
            document.getElementById('screen-voting').classList.remove('active');
            document.getElementById('screen-loading').classList.add('active');

            // Submit the Netlify Form via AJAX
            const formData = new FormData();
            formData.append('form-name', 'poty-vote');
            formData.append('player', playerName);
            formData.append('email', "pending_email_capture@90minutes.com"); // Placeholder for now

            fetch('/', {
                method: 'POST',
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams(formData).toString()
            })
            .then(() => {
                // Simulate a 1.5-second delay for dramatic effect
                setTimeout(() => {
                    document.getElementById('selected-player-name').innerText = playerName;
                    document.getElementById('screen-loading').classList.remove('active');
                    document.getElementById('screen-success').classList.add('active');
                }, 1500);
            })
            .catch(error => {
                console.error('Form submission error:', error);
                alert('There was an issue submitting your vote. Please try again.');
                document.getElementById('screen-loading').classList.remove('active');
                document.getElementById('screen-voting').classList.add('active');
            });
        }
    </script>
</body>
</html>
