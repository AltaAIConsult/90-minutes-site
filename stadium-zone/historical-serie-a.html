<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (GTM-59JRF47P) -->
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-59JRF47P"></script>
    <script>

      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Serie A History | Stadium Zone</title>
    <link rel="stylesheet" href="/css/tailwind.css">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #0a0a0a; 
            color: white;
            overflow: hidden; 
        }
        .font-anton { font-family: 'Anton', sans-serif; }

        .screen { display: none; height: 100vh; height: 100dvh; width: 100vw; position: absolute; top: 0; left: 0; }
        .screen.active { display: flex; flex-direction: column; }

        #timer-bar {
            width: 100%;
            height: 8px;
            background-color: #22c55e; 
            transition: width 0.1s linear, background-color 0.3s;
        }

        .countdown-num {
            font-family: 'Anton', sans-serif;
            font-size: 15rem;
            line-height: 1;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .answer-btn {
            background: #1a1a1a;
            border: 2px solid #333;
            transition: all 0.2s ease;
        }
        .answer-btn:active { transform: scale(0.97); }
        
        .answer-btn.correct { background: rgba(34, 197, 94, 0.2); border-color: #22c55e; color: #22c55e; }
        .answer-btn.wrong { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #ef4444; }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            50% { transform: translateY(-50px) scale(1.2); opacity: 1; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }
        .points-anim { animation: floatUp 1.5s ease-out forwards; }

        /* Zero points: the emoji drops in, wobbles, then the number shakes */
        @keyframes sadDrop {
            0% { transform: translateY(-60px) scale(0.3); opacity: 0; }
            55% { transform: translateY(8px) scale(1.15); opacity: 1; }
            70% { transform: translateY(0) scale(1) rotate(-10deg); }
            85% { transform: rotate(8deg); }
            100% { transform: rotate(0); opacity: 1; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .sad-anim { animation: sadDrop 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .shake-anim { animation: shake 0.5s ease-in-out 0.4s; }

        @keyframes endPop {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .end-pop { animation: endPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; }
    </style>
</head>
<body>

    <!-- SCREEN 1: COUNTDOWN -->
    <div id="screen-countdown" class="screen active items-center justify-center bg-black z-50">
        <h1 id="countdown-text" class="countdown-num">3</h1>
    </div>

    <!-- SCREEN 2: THE QUIZ -->
    <div id="screen-quiz" class="screen bg-[#0a0a0a]">
        
        <!-- Header -->
        <div class="pt-12 px-6 pb-2 w-full max-w-2xl mx-auto">
            <div class="flex justify-between items-center mb-2">
                <span id="question-counter" class="font-bold text-lg text-gray-400">1/10</span>
                <span id="score-text" class="font-bold text-sm text-gray-500">0 pts</span>
                <span id="timer-text" class="font-bold text-green-500"><i class="far fa-clock mr-1"></i> 15s</span>
            </div>
            <div class="w-full bg-gray-800 rounded-full h-2 overflow-hidden">
                <div id="timer-bar"></div>
            </div>
        </div>

        <!-- Question Area -->
        <div class="flex-1 flex flex-col justify-center px-6 pb-20 w-full max-w-2xl mx-auto">
            <h2 id="question-text" class="text-xl md:text-2xl font-bold text-center mb-10 leading-snug">
                Loading Question...
            </h2>

            <!-- Answers Container -->
            <div id="answers-container" class="flex flex-col gap-3"></div>
        </div>
    </div>

    <!-- SCREEN 3: POINTS FOR THE LAST QUESTION -->
    <div id="screen-result" class="screen items-center justify-center bg-[#0a0a0a] z-50">
        <div class="text-center relative">
            <div id="sad-emoji" class="text-7xl mb-2 hidden" aria-hidden="true">😢</div>
            <h1 id="result-points" class="font-anton text-[10rem] leading-none text-white">0</h1>
            <p class="text-gray-400 uppercase tracking-widest font-bold mt-2">Points</p>
            <p id="result-label" class="mt-3 text-sm font-semibold text-gray-500"></p>
            <div id="points-popup" class="absolute top-0 left-1/2 transform -translate-x-1/2 text-green-500 font-anton text-4xl hidden">
                +15
            </div>
        </div>
    </div>

    <!-- SCREEN 4: FINAL SCORE -->
    <div id="screen-end" class="screen items-center justify-center bg-[#0a0a0a] z-50 px-6">
        <div class="w-full max-w-sm text-center">
            <p class="text-gray-400 uppercase tracking-widest font-bold text-xs mb-2">Serie A History · Quiz Complete</p>
            <div id="end-emoji" class="text-6xl mb-3 end-pop">🏆</div>
            <p class="text-gray-300 mb-1">You scored</p>
            <h1 class="font-anton leading-none end-pop" style="animation-delay:.1s">
                <span id="final-score" class="text-8xl text-white">0</span><span class="text-4xl text-gray-500"> / <span id="max-score">150</span></span>
            </h1>
            <p id="final-detail" class="text-sm text-gray-400 mt-3 mb-8"></p>

            <div class="flex flex-col gap-3">
                <button type="button" id="share-btn" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-full transition"><i class="fas fa-share-nodes mr-2"></i>Share Your Score</button>
                <a href="index.html#quizzes-section" class="w-full bg-white hover:bg-gray-200 text-black font-bold py-3 rounded-full transition"><i class="fas fa-gamepad mr-2"></i>Try Another Quiz</a>
                <button type="button" onclick="startQuiz()" class="text-sm text-gray-400 hover:text-white font-semibold py-2 transition"><i class="fas fa-rotate-right mr-1"></i> Play Again</button>
            </div>
            <p id="share-toast" class="hidden text-green-400 text-xs font-semibold mt-2">Score copied to clipboard!</p>
        </div>
    </div>

    <script>
        const QUIZ_TITLE = "Serie A History";
        const POINTS_PER_QUESTION = 15;

        // --- 10 QUESTIONS (correct = index of the right answer; display order is shuffled) ---
        const quizData = [
            {
                question: "Who is the all-time leading goalscorer in Serie A history?",
                answers: ["Francesco Totti", "Gunnar Nordahl", "Silvio Piola", "Giuseppe Meazza"],
                correct: 2
            },
            {
                question: "Which club won five consecutive Serie A titles between 1930 and 1935?",
                answers: ["AC Milan", "Inter Milan", "Juventus", "Bologna"],
                correct: 2
            },
            {
                question: "Which legendary defender captained AC Milan during their dominant late-1980s and 1990s era?",
                answers: ["Alessandro Nesta", "Franco Baresi", "Fabio Cannavaro", "Gaetano Scirea"],
                correct: 1
            },
            {
                question: "Which club did Diego Maradona lead to its first-ever Serie A title in 1987?",
                answers: ["Lazio", "Roma", "Napoli", "Fiorentina"],
                correct: 2
            },
            {
                question: "Which three Dutch stars formed the famous attacking core of AC Milan under Arrigo Sacchi?",
                answers: ["Bergkamp, Gullit and Rijkaard", "Gullit, Rijkaard and Van Basten", "Van Basten, Seedorf and Davids", "Rijkaard, Kluivert and Bergkamp"],
                correct: 1
            },
            {
                question: "Which goalkeeper was famously part of AC Milan’s defensive wall during their 58-match unbeaten Serie A run?",
                answers: ["Gianluigi Buffon", "Walter Zenga", "Sebastiano Rossi", "Angelo Peruzzi"],
                correct: 2
            },
            {
                question: "Who scored Juventus’ goal in the 1996 Champions League final against Ajax?",
                answers: ["Alessandro Del Piero", "Gianluca Vialli", "Fabrizio Ravanelli", "Alessandro Birindelli"],
                correct: 2
            },
            {
                question: "Which Italian club won the 1988–89 Serie A title with a record 58 points in the 18-team format?",
                answers: ["Juventus", "Napoli", "Inter Milan", "AC Milan"],
                correct: 2
            },
            {
                question: "Which player won the 1993 Ballon d’Or while playing for Juventus?",
                answers: ["Roberto Baggio", "Paolo Maldini", "Gianluca Vialli", "Alessandro Del Piero"],
                correct: 0
            },
            {
                question: "Which club did Fabio Capello lead to four Serie A titles in five seasons during his first spell as manager?",
                answers: ["Juventus", "Roma", "AC Milan", "Lazio"],
                correct: 2
            }
        ];

        // --- VARIABLES ---
        let currentQuestion = 0;
        let score = 0;
        let correctCount = 0;
        let timer;
        let timeLeft = 15;
        let canAnswer = false;
        let countInterval;

        // --- DOM ELEMENTS ---
        const screens = {
            countdown: document.getElementById('screen-countdown'),
            quiz: document.getElementById('screen-quiz'),
            result: document.getElementById('screen-result'),
            end: document.getElementById('screen-end'),
        };
        const countdownText = document.getElementById('countdown-text');
        const questionText = document.getElementById('question-text');
        const answersContainer = document.getElementById('answers-container');
        const questionCounter = document.getElementById('question-counter');
        const scoreText = document.getElementById('score-text');
        const timerText = document.getElementById('timer-text');
        const timerBar = document.getElementById('timer-bar');
        const resultPoints = document.getElementById('result-points');
        const resultLabel = document.getElementById('result-label');
        const sadEmoji = document.getElementById('sad-emoji');
        const pointsPopup = document.getElementById('points-popup');
        const maxScore = quizData.length * POINTS_PER_QUESTION;

        function showScreen(name) {
            Object.entries(screens).forEach(([key, el]) => el.classList.toggle('active', key === name));
        }

        function restartAnimation(el, className) {
            el.classList.remove(className);
            void el.offsetWidth;
            el.classList.add(className);
        }

        // --- FUNCTIONS ---

        function startQuiz() {
            currentQuestion = 0;
            score = 0;
            correctCount = 0;
            clearInterval(timer);
            clearInterval(countInterval);
            showScreen('countdown');

            let count = 3;
            countdownText.innerText = count;
            restartAnimation(countdownText, 'countdown-num');

            countInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownText.innerText = count;
                    restartAnimation(countdownText, 'countdown-num');
                } else if (count === 0) {
                    countdownText.innerText = "GO!";
                    restartAnimation(countdownText, 'countdown-num');
                } else {
                    clearInterval(countInterval);
                    showScreen('quiz');
                    loadQuestion();
                }
            }, 1000);
        }

        function loadQuestion() {
            if (currentQuestion >= quizData.length) {
                endQuiz();
                return;
            }

            const q = quizData[currentQuestion];
            questionCounter.innerText = `${currentQuestion + 1}/${quizData.length}`;
            scoreText.innerText = `${score} pts`;
            questionText.innerText = q.question;
            
            timeLeft = 15;
            canAnswer = true;
            updateTimerUI();
            startTimer();

            answersContainer.innerHTML = '';
            // Shuffle display order; each button keeps its original answer index
            const order = q.answers.map((_, i) => i);
            for (let i = order.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [order[i], order[j]] = [order[j], order[i]];
            }
            order.forEach(index => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn w-full py-4 px-6 rounded-xl text-left font-semibold text-lg';
                btn.innerText = q.answers[index];
                btn.dataset.index = index;
                btn.onclick = () => checkAnswer(index);
                answersContainer.appendChild(btn);
            });
        }

        function startTimer() {
            clearInterval(timer);
            timer = setInterval(() => {
                timeLeft -= 0.1;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    timeLeft = 0;
                    updateTimerUI();
                    if (canAnswer) {
                        canAnswer = false;
                        revealAnswer(null);
                        setTimeout(() => showResult(0, "Time's up!"), 1000);
                    }
                } else {
                    updateTimerUI();
                }
            }, 100);
        }

        function updateTimerUI() {
            timerBar.style.width = `${(timeLeft / 15) * 100}%`;
            timerText.innerHTML = `<i class="far fa-clock mr-1"></i> ${Math.ceil(timeLeft)}s`;
            
            const low = timeLeft <= 5;
            timerBar.style.backgroundColor = low ? '#ef4444' : '#22c55e';
            timerText.classList.toggle('text-red-500', low);
            timerText.classList.toggle('text-green-500', !low);
        }

        // Highlight the correct answer (and the wrong pick, if any) and lock the buttons
        function revealAnswer(selectedIndex) {
            const q = quizData[currentQuestion];
            answersContainer.querySelectorAll('button').forEach(btn => {
                const idx = Number(btn.dataset.index);
                btn.style.pointerEvents = 'none';
                if (idx === q.correct) btn.classList.add('correct');
                else if (idx === selectedIndex) btn.classList.add('wrong');
            });
        }

        function checkAnswer(selectedIndex) {
            if (!canAnswer) return;
            canAnswer = false;
            clearInterval(timer);

            const q = quizData[currentQuestion];
            revealAnswer(selectedIndex);

            if (selectedIndex === q.correct) {
                correctCount++;
                setTimeout(() => showResult(POINTS_PER_QUESTION, 'Correct!'), 600);
            } else {
                // Wrong answers always score zero
                setTimeout(() => showResult(0, 'Wrong answer'), 1000);
            }
        }

        function showResult(points, label) {
            score += points;
            showScreen('result');

            resultPoints.innerText = '0';
            resultLabel.innerText = label || '';
            resultPoints.classList.remove('shake-anim');
            pointsPopup.classList.add('hidden');
            sadEmoji.classList.add('hidden');

            if (points === 0) {
                // Zero points animation: sad face drops in and the zero shakes in red
                resultPoints.classList.add('text-red-500');
                resultPoints.classList.remove('text-white');
                resultLabel.className = 'mt-3 text-sm font-semibold text-red-400';
                sadEmoji.classList.remove('hidden');
                restartAnimation(sadEmoji, 'sad-anim');
                restartAnimation(resultPoints, 'shake-anim');
                setTimeout(nextQuestion, 1800);
                return;
            }

            resultPoints.classList.add('text-white');
            resultPoints.classList.remove('text-red-500');
            resultLabel.className = 'mt-3 text-sm font-semibold text-green-400';
            pointsPopup.innerText = `+${points}`;
            pointsPopup.classList.remove('hidden');
            restartAnimation(pointsPopup, 'points-anim');

            let displayPoints = 0;
            const countUp = setInterval(() => {
                if (displayPoints < points) {
                    displayPoints += 1;
                    resultPoints.innerText = displayPoints;
                } else {
                    clearInterval(countUp);
                    setTimeout(nextQuestion, 1200);
                }
            }, 20);
        }

        function nextQuestion() {
            pointsPopup.classList.add('hidden');
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                showScreen('quiz');
                loadQuestion();
            } else {
                endQuiz();
            }
        }

        function endQuiz() {
            clearInterval(timer);
            document.getElementById('final-score').innerText = score;
            document.getElementById('max-score').innerText = maxScore;
            document.getElementById('final-detail').innerText =
                `${correctCount} of ${quizData.length} correct · You scored ${score} out of ${maxScore}`;
            const ratio = score / maxScore;
            document.getElementById('end-emoji').innerText = ratio >= 0.8 ? '🏆' : ratio >= 0.5 ? '⚽' : '😢';
            document.getElementById('share-toast').classList.add('hidden');
            showScreen('end');
        }

        document.getElementById('share-btn').addEventListener('click', async () => {
            const url = location.href.split('#')[0];
            const text = `I scored ${score}/${maxScore} on the ${QUIZ_TITLE} quiz in the 90 Minutes or More Stadium Zone. Can you beat me?`;
            if (navigator.share) {
                try { await navigator.share({ title: `${QUIZ_TITLE} Quiz`, text, url }); } catch (e) { /* user cancelled */ }
                return;
            }
            try {
                await navigator.clipboard.writeText(`${text} ${url}`);
                document.getElementById('share-toast').classList.remove('hidden');
            } catch (e) {
                window.prompt('Copy your score:', `${text} ${url}`);
            }
        });

        // Start on load
        startQuiz();
    </script>
</body>
</html>
