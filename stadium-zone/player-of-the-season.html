    <title>Player of the Season | 90 Minutes or More</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #050505; 
            color: #fbbf24; 
            overflow-x: hidden;
            -ms-overflow-style: none; 
            scrollbar-width: none; 
        }
        body::-webkit-scrollbar { display: none; }
        
        .font-elegant { font-family: 'Playfair Display', serif; }

        .gold-text {
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 40%, #b38728 60%, #fbf5b7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Taller cards to fit the full paragraphs */
        .flip-card { 
            perspective: 1200px; 
            height: 480px; 
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .flip-card.flipped .flip-card-inner { 
            transform: rotateY(180deg); 
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1rem;
            border: 1px solid rgba(251, 191, 36, 0.15);
            background: #0f0f0f;
            overflow: hidden;
        }
        .flip-card-back {
            transform: rotateY(180deg);
            background: #0a0a0a;
            border: 1px solid rgba(251, 191, 36, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.25rem;
            text-align: left;
            overflow-y: auto; /* Allows scrolling if text is long */
        }

        /* THE FIX: Full opacity, full size photo */
        .player-photo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
        }

        /* Screen Transitions */
        .screen { display: none; height: 100vh; width: 100vw; position: fixed; top: 0; left: 0; z-index: 50; flex-direction: column; align-items: center; justify-content: center; }
        .screen.active { display: flex; }

        .pulse-circle { animation: pulse-gold 2.5s infinite; }
        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.3); }
            70% { box-shadow: 0 0 0 25px rgba(251, 191, 36, 0); }
            100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
        }

        .loader {
            border: 3px solid rgba(251, 191, 36, 0.1);
            border-left-color: #fbbf24;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="screen-intro" class="screen active bg-[#050505] text-center px-6">

        </div>
        <h1 class="font-elegant text-4xl md:text-6xl text-white mb-2">Player of the Season</h1>
        <p class="text-yellow-500/80 text-sm tracking-[0.3em] uppercase mb-10">90 Minutes or More</p>
        <button onclick="startExperience()" class="bg-transparent border border-yellow-500 text-yellow-500 hover:bg-yellow-500 hover:text-black font-semibold py-3 px-10 rounded-full text-sm tracking-widest uppercase transition duration-500">
            Unveil Candidates
        </button>
    </div>

    <div id="screen-voting" class="screen bg-[#050505] w-full justify-start overflow-y-auto">

        </div>

        <div id="player-grid" class="w-full max-w-7xl mx-auto px-4 pb-20 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6 mt-2">
            <!-- Cards injected by JS -->
        </div>
    </div>

    <div id="screen-loading" class="screen bg-[#050505]">
        <div class="loader mb-6"></div>
        <h2 class="font-elegant text-2xl text-yellow-500">Casting Your Vote...</h2>
    </div>

    <div id="screen-success" class="screen bg-[#050505] text-center px-6">
        <div class="w-16 h-16 rounded-full bg-yellow-500/10 border border-yellow-500/30 flex items-center justify-center mb-6">
            <i class="fas fa-check text-2xl text-yellow-500"></i>
        </div>
        <h2 class="font-elegant text-3xl md:text-4xl text-white mb-4">Vote Received</h2>
        <p class="text-gray-400 text-sm mb-8">Your vote for <span id="selected-player-name" class="text-yellow-500 font-semibold"></span> has been recorded.</p>
        <a href="../stadium-zone/index.html" class="bg-transparent border border-yellow-500/50 text-yellow-500 hover:bg-yellow-500 hover:text-black font-semibold py-2 px-6 rounded-full text-xs tracking-widest uppercase transition duration-300">
            Back to Stadium Zone
        </a>
    </div>

        <input type="text" name="player" id="form-player-name" />
        <input type="email" name="email" id="form-player-email" />
    </form>

        // --- RENDER CARDS ---
        function renderCards() {
            const grid = document.getElementById('player-grid');
            grid.innerHTML = players.map((p, index) => `
                <div class="flip-card" id="card-${index}" onclick="toggleFlip(${index}, event)">
                    <div class="flip-card-inner">
                        
                        <!-- FRONT: FULL PHOTO & GRADIENT OVERLAY -->
                        <div class="flip-card-front flex flex-col justify-end p-4">
                            <img src="${p.img}" alt="${p.name}" class="player-photo" onerror="this.style.display='none'">
                            
                            <!-- Dark gradient at the bottom so the text is readable -->
                            <div class="absolute inset-0 bg-gradient-to-t from-[#0a0a0a] via-[#0a0a0a]/60 to-transparent pointer-events-none"></div>
                            
                            <div class="relative z-10 text-left">
                                <span class="text-[10px] font-bold text-yellow-500/80 mb-1 block">#${index + 1}</span>
                                <h3 class="font-elegant text-lg md:text-xl text-white leading-tight mb-1">${p.name}</h3>
                                <p class="text-yellow-500/90 text-[10px] font-semibold tracking-wide uppercase">${p.club}</p>
                            </div>
                        </div>

                        <!-- BACK: FULL DESCRIPTION -->
                        <div class="flip-card-back">
                            <div>
                                <h3 class="font-elegant text-lg text-yellow-500 mb-1">${p.name}</h3>
                                <div class="bg-yellow-500/5 border border-yellow-500/10 rounded-lg p-2 mb-3">
                                    <p class="text-yellow-500 font-semibold text-[11px] leading-tight">${p.stats}</p>
                                </div>
                                <p class="text-gray-400 text-[11px] leading-relaxed">${p.description}</p>
                            </div>
                            <button onclick="castVote('${p.name}', event)" class="w-full bg-yellow-500 text-black font-bold py-2.5 rounded-lg hover:bg-yellow-400 transition text-xs uppercase tracking-wider mt-3">
                                Cast Vote
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function startExperience() {
            document.getElementById('screen-intro').classList.remove('active');
            document.getElementById('screen-voting').classList.add('active');
            renderCards();
        }

        function toggleFlip(index, event) {
            if (event.target.tagName === 'BUTTON') return;
            const card = document.getElementById(`card-${index}`);
            document.querySelectorAll('.flip-card').forEach(c => {
                if (c.id !== `card-${index}`) c.classList.remove('flipped');
            });
            card.classList.toggle('flipped');
        }

        function castVote(playerName, event) {
            event.stopPropagation(); 
            document.getElementById('screen-voting').classList.remove('active');
            document.getElementById('screen-loading').classList.add('active');

            const formData = new FormData();
            formData.append('form-name', 'poty-vote');
            formData.append('player', playerName);
            formData.append('email', "pending_email_capture@90minutes.com"); 

            fetch('/', {
                method: 'POST',
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams(formData).toString()
            })
            .then(() => {
                setTimeout(() => {
                    document.getElementById('selected-player-name').innerText = playerName;
                    document.getElementById('screen-loading').classList.remove('active');
                    document.getElementById('screen-success').classList.add('active');
                }, 1500);
            })
            .catch(error => {
                console.error('Form submission error:', error);
                alert('There was an issue submitting your vote. Please try again.');
                document.getElementById('screen-loading').classList.remove('active');
                document.getElementById('screen-voting').classList.add('active');
            });
        }
